# Apply ONLY after the reviewed ownership migration (or isolated test setup).
# Spring creates a separate Flyway datasource with these credentials; Hibernate
# continues to use the service-specific DB_USERNAME/DB_PASSWORD in base Compose.
services:
  platform:
    environment:
      SPRING_FLYWAY_USER: ${PLATFORM_MIGRATION_USERNAME:?Set PLATFORM_MIGRATION_USERNAME}
      SPRING_FLYWAY_PASSWORD: ${PLATFORM_MIGRATION_PASSWORD:?Set PLATFORM_MIGRATION_PASSWORD}
  workforce:
    environment:
      SPRING_FLYWAY_USER: ${WORKFORCE_MIGRATION_USERNAME:?Set WORKFORCE_MIGRATION_USERNAME}
      SPRING_FLYWAY_PASSWORD: ${WORKFORCE_MIGRATION_PASSWORD:?Set WORKFORCE_MIGRATION_PASSWORD}
  payroll:
    environment:
      SPRING_FLYWAY_USER: ${PAYROLL_MIGRATION_USERNAME:?Set PAYROLL_MIGRATION_USERNAME}
      SPRING_FLYWAY_PASSWORD: ${PAYROLL_MIGRATION_PASSWORD:?Set PAYROLL_MIGRATION_PASSWORD}
  finance:
    environment:
      SPRING_FLYWAY_USER: ${FINANCE_MIGRATION_USERNAME:?Set FINANCE_MIGRATION_USERNAME}
      SPRING_FLYWAY_PASSWORD: ${FINANCE_MIGRATION_PASSWORD:?Set FINANCE_MIGRATION_PASSWORD}
