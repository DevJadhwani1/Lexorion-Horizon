name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  service:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: eureka
            module: eureka-server
            context: backend/eureka-server
            kind: maven
          - service: platform
            module: platform-service
            context: backend/platform-service
            kind: maven
          - service: workforce
            module: workforce-service
            context: backend/workforce-service
            kind: maven
          - service: payroll
            module: payroll-service
            context: backend/payroll-service
            kind: maven
          - service: finance
            module: finance-service
            context: backend/finance-service
            kind: maven
          - service: gateway
            module: api-gateway
            context: backend/api-gateway
            kind: maven
          - service: frontend
            module: frontend
            context: frontend
            kind: npm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.kind == 'maven'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/${{ matrix.module }}/pom.xml
      - name: Test
        if: matrix.kind == 'maven'
        working-directory: backend/${{ matrix.module }}
        run: ./mvnw -B test

      - uses: actions/setup-node@v4
        if: matrix.kind == 'npm'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test
        if: matrix.kind == 'npm'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm test
          npm run build

      - id: image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/horizon-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  cd:
    name: CD
    needs: service
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy the published images
        env:
          HORIZON_IMAGE_TAG: main
        run: bash scripts/cd-deploy.sh
