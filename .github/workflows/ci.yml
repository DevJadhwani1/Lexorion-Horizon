name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - platform-service
          - workforce-service
          - payroll-service
          - finance-service
          - api-gateway
          - eureka-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test
        working-directory: backend/${{ matrix.module }}
        run: ./mvnw -B test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, check, and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          npm test
          npm run build

  images:
    name: Build and publish images
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker compose --env-file infrastructure/ci/compose.env build
          docker compose --env-file infrastructure/ci/compose.env config -q
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish images
        run: |
          set -eu
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sha="${{ github.sha }}"
          for service in eureka platform workforce payroll finance gateway frontend; do
            source="lexorion-horizon-${service}:latest"
            remote="ghcr.io/${owner}/horizon-${service}"
            docker tag "$source" "${remote}:${sha}"
            docker tag "$source" "${remote}:main"
            docker push "${remote}:${sha}"
            docker push "${remote}:main"
          done
