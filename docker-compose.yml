name: lexorion-horizon

x-backend-healthcheck: &backend-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 30s

x-database-environment: &database-environment
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:9003/eureka/

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set the database provisioning administrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the database provisioning password}
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:-platform_db}
      PLATFORM_DB_USERNAME: ${PLATFORM_DB_USERNAME:?Set PLATFORM_DB_USERNAME}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD}
      WORKFORCE_DB_NAME: ${WORKFORCE_DB_NAME:-lexorion_workforce}
      WORKFORCE_DB_USERNAME: ${WORKFORCE_DB_USERNAME:?Set WORKFORCE_DB_USERNAME}
      WORKFORCE_DB_PASSWORD: ${WORKFORCE_DB_PASSWORD:?Set WORKFORCE_DB_PASSWORD}
      PAYROLL_DB_NAME: ${PAYROLL_DB_NAME:-lexorion_payroll}
      PAYROLL_DB_USERNAME: ${PAYROLL_DB_USERNAME:?Set PAYROLL_DB_USERNAME}
      PAYROLL_DB_PASSWORD: ${PAYROLL_DB_PASSWORD:?Set PAYROLL_DB_PASSWORD}
      FINANCE_DB_NAME: ${FINANCE_DB_NAME:-lexorion_finance}
      FINANCE_DB_USERNAME: ${FINANCE_DB_USERNAME:?Set FINANCE_DB_USERNAME}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:?Set FINANCE_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - horizon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  eureka:
    build: ./backend/eureka-server
    environment:
      EUREKA_PORT: 9003
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:9003/eureka/
    ports: ["127.0.0.1:9003:9003"]
    networks: [horizon]
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9003/actuator/health"]

  platform:
    build: ./backend/platform-service
    environment:
      <<: *database-environment
      PLATFORM_PORT: 9002
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      INVITATION_FROM: ${INVITATION_FROM:-}
      INVITATION_PUBLIC_ORIGIN: ${INVITATION_PUBLIC_ORIGIN:-}
      DB_NAME: ${PLATFORM_DB_NAME:-platform_db}
      DB_USERNAME: ${PLATFORM_DB_USERNAME:?Set PLATFORM_DB_USERNAME to a dedicated database role}
      DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a unique secret of at least 32 characters}
      WORKFORCE_SERVICE_TOKEN: ${WORKFORCE_SERVICE_TOKEN:?Set WORKFORCE_SERVICE_TOKEN to a unique secret of at least 32 characters}
      PAYROLL_SERVICE_TOKEN: ${PAYROLL_SERVICE_TOKEN:?Set PAYROLL_SERVICE_TOKEN to a unique secret of at least 32 characters}
      FINANCE_SERVICE_TOKEN: ${FINANCE_SERVICE_TOKEN:?Set FINANCE_SERVICE_TOKEN to a unique secret of at least 32 characters}
      LEXORION_BOOTSTRAP_ENABLED: ${LEXORION_BOOTSTRAP_ENABLED:-false}
      LEXORION_BOOTSTRAP_EMAIL: ${LEXORION_BOOTSTRAP_EMAIL:-}
      LEXORION_BOOTSTRAP_PASSWORD: ${LEXORION_BOOTSTRAP_PASSWORD:-}
      LEXORION_CLIENT_SEED_ENABLED: ${LEXORION_CLIENT_SEED_ENABLED:-false}
      LEXORION_CLIENT_SEED_EMAIL: ${LEXORION_CLIENT_SEED_EMAIL:-dev@lexorion.in}
      LEXORION_CLIENT_SEED_PASSWORD: ${LEXORION_CLIENT_SEED_PASSWORD:-}
      LEXORION_CLIENT_SEED_FIRST_NAME: ${LEXORION_CLIENT_SEED_FIRST_NAME:-Dev}
      LEXORION_CLIENT_SEED_LAST_NAME: ${LEXORION_CLIENT_SEED_LAST_NAME:-Jadhwani}
      LEXORION_CLIENT_SEED_ORGANIZATION_NAME: ${LEXORION_CLIENT_SEED_ORGANIZATION_NAME:-Lexorion Client}
      LEXORION_CLIENT_SEED_ORGANIZATION_CODE: ${LEXORION_CLIENT_SEED_ORGANIZATION_CODE:-LEXORION-CLIENT}
      LEXORION_CLIENT_SEED_ORGANIZATION_SLUG: ${LEXORION_CLIENT_SEED_ORGANIZATION_SLUG:-lexorion-client}
      # AXON runtime security monitor: login outcomes are published only when AXON_ENABLED=true.
      # From this container AXON on the same Mac is http://host.docker.internal:8100 (not localhost).
      AXON_ENABLED: ${AXON_ENABLED:-false}
      AXON_BASE_URL: ${AXON_BASE_URL:-}
      AXON_INGESTION_KEY: ${AXON_INGESTION_KEY:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    expose: ["9002"]
    networks: [horizon]
    depends_on:
      postgres: {condition: service_healthy}
      eureka: {condition: service_healthy}
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9002/actuator/health"]

  workforce:
    build: ./backend/workforce-service
    environment:
      <<: *database-environment
      WORKFORCE_PORT: 9004
      DB_NAME: ${WORKFORCE_DB_NAME:-lexorion_workforce}
      DB_USERNAME: ${WORKFORCE_DB_USERNAME:?Set WORKFORCE_DB_USERNAME to a dedicated database role}
      DB_PASSWORD: ${WORKFORCE_DB_PASSWORD:?Set WORKFORCE_DB_PASSWORD}
      LEXORION_PLATFORM_SERVICE_URL: http://platform-service
      WORKFORCE_SERVICE_TOKEN: ${WORKFORCE_SERVICE_TOKEN:?Set WORKFORCE_SERVICE_TOKEN to a unique secret of at least 32 characters}
      PAYROLL_SERVICE_TOKEN: ${PAYROLL_SERVICE_TOKEN:?Set PAYROLL_SERVICE_TOKEN to a unique secret of at least 32 characters}
    extra_hosts: ["host.docker.internal:host-gateway"]
    expose: ["9004"]
    networks: [horizon]
    depends_on:
      postgres: {condition: service_healthy}
      eureka: {condition: service_healthy}
      platform: {condition: service_healthy}
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9004/actuator/health"]

  payroll:
    build: ./backend/payroll-service
    environment:
      <<: *database-environment
      PAYROLL_PORT: 9005
      DB_NAME: ${PAYROLL_DB_NAME:-lexorion_payroll}
      DB_USERNAME: ${PAYROLL_DB_USERNAME:?Set PAYROLL_DB_USERNAME to a dedicated database role}
      DB_PASSWORD: ${PAYROLL_DB_PASSWORD:?Set PAYROLL_DB_PASSWORD}
      LEXORION_PLATFORM_SERVICE_URL: http://platform-service
      LEXORION_WORKFORCE_SERVICE_URL: http://workforce-service
      PAYROLL_SERVICE_TOKEN: ${PAYROLL_SERVICE_TOKEN:?Set PAYROLL_SERVICE_TOKEN to a unique secret of at least 32 characters}
    extra_hosts: ["host.docker.internal:host-gateway"]
    expose: ["9005"]
    networks: [horizon]
    depends_on:
      postgres: {condition: service_healthy}
      eureka: {condition: service_healthy}
      platform: {condition: service_healthy}
      workforce: {condition: service_healthy}
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9005/actuator/health"]

  finance:
    build: ./backend/finance-service
    environment:
      <<: *database-environment
      FINANCE_PORT: 9006
      DB_NAME: ${FINANCE_DB_NAME:-lexorion_finance}
      DB_USERNAME: ${FINANCE_DB_USERNAME:?Set FINANCE_DB_USERNAME to a dedicated database role}
      DB_PASSWORD: ${FINANCE_DB_PASSWORD:?Set FINANCE_DB_PASSWORD}
      LEXORION_PLATFORM_SERVICE_URL: http://platform-service
      FINANCE_SERVICE_TOKEN: ${FINANCE_SERVICE_TOKEN:?Set FINANCE_SERVICE_TOKEN to a unique secret of at least 32 characters}
    extra_hosts: ["host.docker.internal:host-gateway"]
    expose: ["9006"]
    networks: [horizon]
    depends_on:
      postgres: {condition: service_healthy}
      eureka: {condition: service_healthy}
      platform: {condition: service_healthy}
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9006/actuator/health"]

  gateway:
    build: ./backend/api-gateway
    environment:
      GATEWAY_PORT: 9001
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:9003/eureka/
    ports: ["127.0.0.1:9001:9001"]
    networks: [horizon]
    depends_on:
      eureka: {condition: service_healthy}
    healthcheck:
      <<: *backend-healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9001/actuator/health"]

  frontend:
    build: ./frontend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports: ["${HORIZON_BIND_ADDRESS:-127.0.0.1}:80:9000", "127.0.0.1:9000:9000"]
    networks: [horizon]
    depends_on:
      gateway: {condition: service_healthy}
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      test: ["CMD", "wget", "-q", "--spider", "--header", "Host: localhost", "http://127.0.0.1:9000/"]

networks:
  horizon:
    driver: bridge

volumes:
  postgres-data:
    external: true
    name: ${POSTGRES_DATA_VOLUME:?Set POSTGRES_DATA_VOLUME to the existing data volume or create a new empty volume}
