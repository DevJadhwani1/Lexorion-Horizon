
server {
    listen 80;
    server_name localhost 127.0.0.1 horizon.lexorion.in admin.horizon.lexorion.in core.lexorion.in;
    # The published port is 80. An absolute redirect would advertise the
    # container port 9000 and move the browser off the address it opened.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Docker gives a container a new address when it is recreated. A literal
    # proxy_pass name is resolved only at startup, so later requests keep the
    # dead address and Nginx returns 502. A variable makes Nginx ask Docker DNS again.
    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $gateway_upstream gateway:9001;
        proxy_pass http://$gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Temporary redirects from the retired /app prefix. Canonical pages are
    # served by the SPA fallback below. /api stays on the gateway.
    location = /app {
        return 302 /overview$is_args$args;
    }

    location ^~ /app/ {
        rewrite ^/app/organization/members/?$ /people redirect;
        rewrite ^/app/members/?$ /people redirect;
        rewrite ^/app/admin/members/?$ /people redirect;
        rewrite ^/app/organization/settings/product-access/?$ /organization/settings/product-access redirect;
        rewrite ^/app/organization/entitlements/?$ /organization/settings/product-access redirect;
        rewrite ^/app/organization/settings/?$ /organization/settings redirect;
        rewrite ^/app/settings/?$ /organization/settings redirect;
        rewrite ^/app/admin/settings/?$ /organization/settings redirect;
        rewrite ^/app/admin/entitlements/?$ /organization/settings/product-access redirect;
        rewrite ^/app/entitlements/?$ /organization/settings/product-access redirect;
        rewrite ^/app/organization/departments/?$ /workforce/departments redirect;
        rewrite ^/app/payroll/?$ /payroll/runs redirect;
        rewrite ^/app/payroll/dashboard/?$ /payroll/runs redirect;
        rewrite ^/app/payroll/pay-runs/?$ /payroll/runs redirect;
        rewrite ^/app/payroll/runs/?$ /payroll/runs redirect;
        rewrite ^/app/workforce/dashboard/?$ /workforce/employees redirect;
        rewrite ^/app/platform/?$ /platform redirect;
        rewrite ^/app/platform/(.+)$ /platform/$1 redirect;
        rewrite ^/app/(.+)$ /$1 redirect;
        return 302 /overview;
    }

    location = /organization/members { return 302 /people$is_args$args; }
    location = /settings/organization { return 302 /organization/settings$is_args$args; }
    location = /settings/organization/product-access { return 302 /organization/settings/product-access$is_args$args; }
    location = /settings { return 302 /organization/settings$is_args$args; }
    location = /entitlements { return 302 /organization/settings/product-access$is_args$args; }
    location = /admin/settings { return 302 /organization/settings$is_args$args; }
    location = /admin/entitlements { return 302 /organization/settings/product-access$is_args$args; }
    location = /organization/entitlements { return 302 /organization/settings/product-access$is_args$args; }
    location = /organization/departments { return 302 /workforce/departments$is_args$args; }
    location = /payroll/pay-runs { return 302 /payroll/runs$is_args$args; }
    location = /payroll/dashboard { return 302 /payroll/runs$is_args$args; }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~ ^/((lexorion-)?favicon.*?\.(ico|png|svg)|icon-.*?\.(ico|png|svg)|apple-touch-icon.*?\.(ico|png|svg)|brand.*?\.(ico|png|svg)|site\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
