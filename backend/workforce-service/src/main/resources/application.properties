spring.application.name=workforce-service
server.port=${WORKFORCE_PORT:9004}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:9003/eureka/}
eureka.instance.prefer-ip-address=true
spring.datasource.url=${WORKFORCE_DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lexorion_workforce}}
spring.datasource.username=${WORKFORCE_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${WORKFORCE_DB_PASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
lexorion.platform-service-url=${LEXORION_PLATFORM_SERVICE_URL:http://platform-service}
lexorion.http.connect-timeout=${LEXORION_HTTP_CONNECT_TIMEOUT:2s}
lexorion.http.read-timeout=${LEXORION_HTTP_READ_TIMEOUT:3s}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
lexorion.service-auth.workforce-token=${WORKFORCE_SERVICE_TOKEN}
lexorion.service-auth.payroll-token=${PAYROLL_SERVICE_TOKEN}
