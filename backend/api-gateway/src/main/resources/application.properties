spring.application.name=api-gateway
server.port=${GATEWAY_PORT:9001}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:9003/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# Strip all service-to-service authority headers supplied by a browser/client.
# Public X-Lexorion-Organization and X-Lexorion-Workspace selectors are preserved.
spring.cloud.gateway.server.webmvc.default-filters[0]=RemoveRequestHeader=X-Lexorion-Trusted-Organization-Id
spring.cloud.gateway.server.webmvc.default-filters[1]=RemoveRequestHeader=X-Lexorion-Trusted-Workspace-Id
spring.cloud.gateway.server.webmvc.default-filters[2]=RemoveRequestHeader=X-Lexorion-Trusted-User-Id
spring.cloud.gateway.server.webmvc.default-filters[3]=RemoveRequestHeader=X-Lexorion-Trusted-Role

spring.cloud.gateway.server.webmvc.routes[0].id=platform-api
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://PLATFORM-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/platform/**

spring.cloud.gateway.server.webmvc.routes[1].id=tenant-api
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://PLATFORM-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/tenant/**

spring.cloud.gateway.server.webmvc.routes[2].id=workforce-api
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://WORKFORCE-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/workforce/**

spring.cloud.gateway.server.webmvc.routes[3].id=payroll-api
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://PAYROLL-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/payroll/**

spring.cloud.gateway.server.webmvc.routes[4].id=finance-api
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://FINANCE-SERVICE
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/finance/**
