spring.application.name=payroll-service
server.port=${PAYROLL_PORT:9005}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:9003/eureka/}
eureka.instance.prefer-ip-address=true
spring.datasource.url=${PAYROLL_DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lexorion_payroll}}
spring.datasource.username=${PAYROLL_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${PAYROLL_DB_PASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
lexorion.platform-service-url=${LEXORION_PLATFORM_SERVICE_URL:http://platform-service}
lexorion.workforce-service-url=${LEXORION_WORKFORCE_SERVICE_URL:http://workforce-service}
lexorion.http.connect-timeout=${LEXORION_HTTP_CONNECT_TIMEOUT:2s}
lexorion.http.read-timeout=${LEXORION_HTTP_READ_TIMEOUT:3s}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
lexorion.service-auth.payroll-token=${PAYROLL_SERVICE_TOKEN}
