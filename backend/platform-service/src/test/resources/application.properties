spring.datasource.url=jdbc:h2:mem:platform;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
lexorion.test.legacy-catalog=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
security.jwt.secret=test-only-jwt-secret-that-is-at-least-thirty-two-bytes-long
security.jwt.issuer=lexorion-horizon-platform-test
security.jwt.access-token-ttl=PT15M
security.refresh-token-ttl=P30D
lexorion.domains.shared-platform-hostname=horizon.lexorion.in
lexorion.service-auth.workforce-token=test-workforce-service-token-32-bytes-minimum
lexorion.service-auth.payroll-token=test-payroll-service-token-32-bytes-minimum
