spring.application.name=platform-service
server.port=${PLATFORM_PORT:9002}
spring.datasource.url=${PLATFORM_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:platform_db}}}
spring.datasource.username=${PLATFORM_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}}
spring.datasource.password=${PLATFORM_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:9003/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:lexorion-horizon-platform}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
security.refresh-token-ttl=${REFRESH_TOKEN_TTL:P30D}
lexorion.bootstrap.enabled=${LEXORION_BOOTSTRAP_ENABLED:false}
lexorion.bootstrap.email=${LEXORION_BOOTSTRAP_EMAIL:}
lexorion.bootstrap.password=${LEXORION_BOOTSTRAP_PASSWORD:}
lexorion.client-seed.enabled=${LEXORION_CLIENT_SEED_ENABLED:false}
lexorion.client-seed.email=${LEXORION_CLIENT_SEED_EMAIL:dev@lexorion.in}
lexorion.client-seed.password=${LEXORION_CLIENT_SEED_PASSWORD:}
lexorion.client-seed.first-name=${LEXORION_CLIENT_SEED_FIRST_NAME:Dev}
lexorion.client-seed.last-name=${LEXORION_CLIENT_SEED_LAST_NAME:Jadhwani}
lexorion.client-seed.organization-name=${LEXORION_CLIENT_SEED_ORGANIZATION_NAME:Lexorion Client}
lexorion.client-seed.organization-code=${LEXORION_CLIENT_SEED_ORGANIZATION_CODE:LEXORION-CLIENT}
lexorion.client-seed.organization-slug=${LEXORION_CLIENT_SEED_ORGANIZATION_SLUG:lexorion-client}
lexorion.domains.shared-platform-hostname=${LEXORION_SHARED_PLATFORM_HOSTNAME:horizon.lexorion.in}
lexorion.invitations.ttl=${LEXORION_INVITATION_TTL:P7D}
lexorion.service-auth.workforce-token=${WORKFORCE_SERVICE_TOKEN}
lexorion.service-auth.payroll-token=${PAYROLL_SERVICE_TOKEN}
lexorion.service-auth.finance-token=${FINANCE_SERVICE_TOKEN}

lexorion.invitations.from=${INVITATION_FROM:}
lexorion.invitations.public-origin=${INVITATION_PUBLIC_ORIGIN:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.host=${SMTP_HOST:}
# SMTP failure is tracked per invitation; it must not disable unrelated identity/tenant APIs.
management.health.mail.enabled=false
# AXON runtime security integration: login outcomes are sent to AXON only when explicitly enabled.
lexorion.axon.enabled=${AXON_ENABLED:false}
lexorion.axon.base-url=${AXON_BASE_URL:}
lexorion.axon.ingestion-key=${AXON_INGESTION_KEY:}
