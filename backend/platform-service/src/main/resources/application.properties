spring.application.name=platform-service
server.port=${PLATFORM_PORT:9002}
spring.datasource.url=${PLATFORM_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:platform_db}}}
spring.datasource.username=${PLATFORM_DB_USERNAME:${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}}
spring.datasource.password=${PLATFORM_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:9003/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:lexorion-horizon-platform}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
security.refresh-token-ttl=${REFRESH_TOKEN_TTL:P30D}
lexorion.bootstrap.enabled=${LEXORION_BOOTSTRAP_ENABLED:false}
lexorion.bootstrap.email=${LEXORION_BOOTSTRAP_EMAIL:}
lexorion.bootstrap.password=${LEXORION_BOOTSTRAP_PASSWORD:}
lexorion.domains.shared-platform-hostname=${LEXORION_SHARED_PLATFORM_HOSTNAME:horizon.lexorion.in}
lexorion.invitations.ttl=${LEXORION_INVITATION_TTL:P7D}
lexorion.service-auth.workforce-token=${WORKFORCE_SERVICE_TOKEN}
lexorion.service-auth.payroll-token=${PAYROLL_SERVICE_TOKEN}
