spring.application.name=finance-service
server.port=${FINANCE_PORT:9006}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:9003/eureka/}
eureka.instance.prefer-ip-address=true
spring.datasource.url=${FINANCE_DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lexorion_finance}}
spring.datasource.username=${FINANCE_DB_USERNAME:${DB_USERNAME}}
spring.datasource.password=${FINANCE_DB_PASSWORD:${DB_PASSWORD}}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
lexorion.platform-service-url=${LEXORION_PLATFORM_SERVICE_URL:http://platform-service}
lexorion.http.connect-timeout=${LEXORION_HTTP_CONNECT_TIMEOUT:2s}
lexorion.http.read-timeout=${LEXORION_HTTP_READ_TIMEOUT:3s}
lexorion.service-auth.finance-token=${FINANCE_SERVICE_TOKEN}
